swagger: '2.0'
info:
  version: 1.0.0
  title: Markup AI Content Guardian Agents
  description: >-
      Markup AI checks, scores, and fixes content at scale. It enforces brand guidelines—style, consistency, clarity, and terminology—inside your existing workflows and tools. Developers and content owners integrate via MCP/LLMs or no-code solutions. It cuts manual reviews, inconsistency, and compliance risks to speed content production by checking, scoring, and rewriting content with your established brand guidelines. Results: consistent voice, reduced risk, and faster content publishing.
host: api.markup.ai
basePath: /
schemes:
  - https
consumes: []
produces:
  - application/json
paths:
  /v1/style-guides/{style_guide_id}:
    get:
      summary: Get Style Guide
      description: >-
        Retrieve a specific style guide by ID, including its metadata such as
        `name` and `status`.
      operationId: GetStyleGuide
      parameters:
        - $ref: '#/parameters/StyleGuideId'
      responses:
        '200':
          description: '200'
          schema:
            $ref: '#/definitions/StyleGuideResponse'
        '401':
          description: '401'
          schema:
            $ref: '#/definitions/StandardError'
        '403':
          description: '403'
          schema:
            $ref: '#/definitions/StandardError'
        '404':
          description: '404'
          schema:
            $ref: '#/definitions/StandardError'
        '422':
          description: '422'
          schema:
            $ref: '#/definitions/StandardError'
        '500':
          description: '500'
          schema:
            $ref: '#/definitions/StandardError'
      x-ms-visibility: advanced
    delete:
      summary: Delete Style Guide
      description: Delete a style guide by ID.
      operationId: DeleteStyleGuide
      parameters:
        - $ref: '#/parameters/StyleGuideId'
      responses:
        '204':
          description: '204'
          schema:
            type: string
        '401':
          description: '401'
          schema:
            $ref: '#/definitions/StandardError'
        '403':
          description: '403'
          schema:
            $ref: '#/definitions/StandardError'
        '404':
          description: '404'
          schema:
            $ref: '#/definitions/StandardError'
        '422':
          description: '422'
          schema:
            $ref: '#/definitions/StandardError'
        '500':
          description: '500'
          schema:
            $ref: '#/definitions/StandardError'
      x-ms-visibility: advanced
    patch:
      summary: Update Style Guide
      description: Update the name of an existing style guide.
      operationId: UpdateStyleGuide
      parameters:
        - $ref: '#/parameters/StyleGuideId'
        - name: body
          in: body
          schema:
            type: object
            properties:
              name:
                type: string
                x-ms-summary: Name
                description: name
            default:
              name: string
          required: true
      responses:
        '200':
          description: '200'
          schema:
            $ref: '#/definitions/StyleGuideResponse'
        '401':
          description: '401'
          schema:
            $ref: '#/definitions/StandardError'
        '403':
          description: '403'
          schema:
            $ref: '#/definitions/StandardError'
        '404':
          description: '404'
          schema:
            $ref: '#/definitions/StandardError'
        '422':
          description: '422'
          schema:
            $ref: '#/definitions/StandardError'
        '500':
          description: '500'
          schema:
            $ref: '#/definitions/StandardError'
        default:
          description: '200'
          schema:
            $ref: '#/definitions/StyleGuideResponse'
      x-ms-visibility: advanced
  /v1/style-guides:
    get:
      summary: List Style Guides
      description: Retrieve all style guides associated with your organization.
      operationId: ListStyleGuides
      produces:
        - application/json
      responses:
        '200':
          description: '200'
          schema:
            type: array
            items:
              $ref: '#/definitions/StyleGuideResponse'
        '401':
          description: '401'
          schema:
            $ref: '#/definitions/StandardError'
        '403':
          description: '403'
          schema:
            $ref: '#/definitions/StandardError'
        '422':
          description: '422'
          schema:
            $ref: '#/definitions/StandardError'
        '500':
          description: '500'
          schema:
            $ref: '#/definitions/StandardError'
      x-ms-visibility: advanced
    post:
      summary: Create Style Guide
      description: >-
        Create a new style guide that can be used in checks, suggestions, and
        rewrites.
      operationId: CreateStyleGuide
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - in: formData
          name: file_upload
          description: The document to analyze. We accept PDF files (.pdf) up to 2 MB.
          required: true
          type: file
        - in: formData
          name: name
          type: string
          required: true
          description: A friendly name for your style guide to help you identify it later
        - in: formData
          name: base_style_guide
          required: true
          type: string
          description: >-
            The base style guide to extend (AP, Chicago, or Microsoft). If not
            provided, the style guide will be created from scratch.
          x-ms-summary: Base Style Guide
          enum:
            - ap
            - chicago
            - microsoft
          x-ms-enum:
            name: base_style_guide
            modelAsString: true
            values:
              - name: ap
                value: ap
                displayName: ap
              - name: chicago
                value: chicago
                displayName: chicago
              - name: microsoft
                value: microsoft
                displayName: microsoft
      responses:
        '202':
          description: '202'
          schema:
            $ref: '#/definitions/StyleGuideResponse'
        '401':
          description: '401'
          schema:
            $ref: '#/definitions/StandardError'
        '403':
          description: '403'
          schema:
            $ref: '#/definitions/StandardError'
        '413':
          description: '413'
          schema:
            $ref: '#/definitions/StandardError'
        '422':
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ValidationError'
        '500':
          description: '500'
          schema:
            $ref: '#/definitions/StandardError'
        default:
          description: '202'
          schema:
            $ref: '#/definitions/StyleGuideResponse'
          x-ms-visibility: advanced
  /v1/style/checks/{workflow_id}:
    get:
      summary: Get Style Check
      description: Retrieve style check results.
      operationId: GetStyleCheck
      parameters:
        - $ref: '#/parameters/WorkflowId'
      responses:
        '200':
          description: '200'
          schema:
            $ref: '#/definitions/StyleCheckResponse'
        '401':
