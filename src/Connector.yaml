          description: '202'
          schema:
            $ref: '#/definitions/AsyncOperationResponse'
        '401':
          description: '401'
          schema:
            $ref: '#/definitions/StandardError'
        '403':
          description: '403'
          schema:
            $ref: '#/definitions/StandardError'
        '413':
          description: '413'
          schema:
            $ref: '#/definitions/StandardError'
        '422':
          description: '422'
          schema:
            $ref: '#/definitions/ValidationError'
        '429':
          description: '429'
          schema:
            $ref: '#/definitions/StandardError'
        '500':
          description: '500'
          schema:
            $ref: '#/definitions/StandardError'
        default:
          description: '202'
          schema:
            $ref: '#/definitions/AsyncOperationResponse'
      x-ms-visibility: important
  /v1/style/suggestions/{workflow_id}:
    get:
      summary: Get Style Suggestion
      description: Retrieve suggestion results.
      operationId: GetStyleSuggestion
      parameters:
