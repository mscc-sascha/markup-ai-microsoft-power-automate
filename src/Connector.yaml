                        title: Terminology Score
                      issues:
                        type: integer
                        format: int32
                        description: Number of terminology issues found
                        title: Terminology Issue Count
              analysis:
                type: object
                properties:
                  clarity:
                    type: object
                    properties:
                      score:
                        type: integer
                        format: int32
                        description: Overall clarity score
                        title: Clarity Score
                      flesch_reading_ease:
                        type: number
                        format: float
                        description: Flesch Reading Ease score (higher is easier to read)
                        title: Flesch Reading Ease
                      sentence_complexity:
                        type: number
                        format: float
                        description: Complexity measure of sentences
                        title: Sentence Complexity
                      vocabulary_complexity:
                        type: number
                        format: float
                        description: Complexity measure of vocabulary used
                        title: Vocabulary Complexity
                      sentence_count:
                        type: integer
                        format: int32
                        description: Total number of sentences
                        title: Sentences Count
