parameters:
  StyleGuideId:
    name: style_guide_id
    in: path
    type: string
    required: true
    x-ms-summary: Style Guide Id
  WorkflowId:
    name: workflow_id
    in: path
    type: string
    required: true
    x-ms-summary: Workflow Id
  AnalysisFileUpload:
    in: formData
    name: file_upload
    x-ms-summary: Document
    description: >-
      The document to analyze. Text (.txt), Markdown (.md), HTML (.html .htm),
      DITA (.dita, .xml), and PDF (.pdf) files are accepted. The max file size
      is 1.5 MB.
    required: true
    type: file
  Dialect:
    in: formData
    name: dialect
    type: string
    x-ms-summary: Dialect
    required: true
    description: >-
      The language variant you'd like us to use for analysis. Choose from
      American English, British English, or other supported dialects.
    enum:
      - american_english
      - british_english
      - canadian_english
    x-ms-enum:
      name: Dialect
      modelAsString: true
      values:
        - name: american_english
          value: american_english
          displayName: American English
        - name: british_english
          value: british_english
          displayName: British English
        - name: canadian_english
          value: canadian_english
          displayName: Canadian English
  StyleGuideParam:
    in: formData
    name: style_guide
    required: true
    type: string
    description: >-
      The style guide to follow for your content. You can use a style guide ID
      or choose from built-in options: `ap`, `chicago`, or `microsoft`.
    x-ms-summary: Style Guide
    x-ms-dynamic-values:
      operationId: ListStyleGuides
      value-path: id
      value-title: name
  Tone:
    in: formData
    name: tone
    type: string
    description: >-
      The tone variation you're aiming for. Options include formal, academic,
      casual, and other tone variations to match your content goals..
    enum:
      - academic
      - confident
      - conversational
      - empathetic
      - engaging
      - friendly
      - professional
      - technical
    x-ms-enum:
      name: Tone
      modelAsString: true
      values:
        - name: academic
          value: academic
          displayName: academic
        - name: confident
          value: confident
          displayName: confident
        - name: conversational
          value: conversational
          displayName: conversational
        - name: empathetic
          value: empathetic
          displayName: empathetic
        - name: engaging
          value: engaging
          displayName: engaging
        - name: friendly
          value: friendly
          displayName: friendly
        - name: professional
          value: professional
          displayName: professional
        - name: technical
          value: technical
          displayName: technical
  WebhookUrl:
    in: formData
    name: webhook_url
    type: string
    description: A URL that results will be POSTed to once the process completes.
responses: {}
